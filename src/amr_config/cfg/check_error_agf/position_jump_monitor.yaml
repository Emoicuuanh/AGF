map_frame: "map"
odom_frame: "odom"
base_frame: "base_link"
rate: 20.0
jump_xy: 0.05        # m per sample not explained by odometry
jump_yaw: 3.0        # deg per sample not explained by odometry
max_speed: 1.5       # m/s, check used while /odom is missing
max_yaw_rate: 1.5    # rad/s, check used while /odom is missing
stale_timeout: 1.0   # s without a new map -> base_link
log_dir: "~/.ros/log"
keep_days: 30

# config/livox_center_filter.yaml
# Cấu hình cho livox_center_detector

# Thời gian tích lũy điểm (giây)
buffer_time: 0.1

# Tần suất xuất bản (Hz)
publish_rate: 100.0

# Góc quét (độ)
angle_min1: -10.0
angle_max1: 90.0

# Vùng không gian quan tâm
max_z1: 0.4
min_z1: 0.001 #-0.2
max_x1: 3.0
max_y1: 0.9
min_y1: 0.1

# Min filter points
min_filter_points: 50

# RANSAC
ransac_distance_threshold: 0.05
ransac_n: 3
ransac_iterations: 100

# Lọc cụm
min_plane_points: 100

# Kích thước voxel (m) để làm thưa đám mây trước DBSCAN; mặt phẳng/đường vẫn dùng điểm đầy đủ.
# 0 = tắt. Khi bật, dbscan_min_samples đếm số voxel thay vì số điểm.
cluster_voxel: 0.02

line_distance_threshold: 0.05
line_min_inliers: 30
line_ransac_iterations: 100

# Góc lệch tối đa giữa mặt pallet và trục X của livox (độ)
max_yaw_deg: 30.0

# Hướng lắp Livox (rad), PHẢI trùng livox_roll / livox_pitch trong
# pick_and_place_pallet/pallet_tf_publisher.yaml (TF base_link -> livox_frame).
# Đám mây được xoay về khung nằm ngang (cùng gốc & hướng với Livox, z hướng lên) trước khi detect,
# nên mọi vùng cắt / ngưỡng ở trên giữ nguyên ý nghĩa như khi Livox lắp phẳng; kết quả được xoay lại
# về livox_frame khi phát. Lệch so với TF -> cảnh báo lúc khởi động. 0, 0 = lắp phẳng (như cũ).
livox_roll: -0.1895129165580368  # -10.79 deg from the Livox IMU, = pallet_tf_publisher.yaml
livox_pitch: 0.030238007382436555  # 1.83 deg down (positive = x axis down) from the Livox IMU, = pallet_tf_publisher.yaml
livox_mount_yaw: 1.5708  # +90 deg: Livox +y faces the pallet; detection still runs with x toward the pallet
base_frame: base_link   # chỉ dùng để kiểm tra với TF

# Livox x / y in base_link with the lidar cylinder RETRACTED (= livox_x / livox_y of
# pallet_tf_publisher.yaml): the crop window is tuned there. When the cylinder pushes the Livox out
# (TF moves livox_frame by distance_xylanh) the window is shifted back, so it stays on the pallet.
# Remove both lines to keep the window fixed to the Livox (old behaviour).
crop_ref_x: -0.355
crop_ref_y: 0.54

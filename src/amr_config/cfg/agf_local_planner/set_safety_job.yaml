# set_safety_job.py parameters
# Safety field order on /safety_control: [top, left, right, front]

# Speed limit sent when robot is out of zone / not aligned with zone (m/s)
default_max_velocity: 1.0

# Default safety field when out of zone (same as agf_local_planner setSafety())
default_safety_forward: [1, 1, 1, 3]
default_safety_backward: [4, 1, 1, 1]

# |cmd_vel.linear.x| below this keeps the last direction (stopped / steering only)
direction_vel_threshold: 0.001

# Planner overrides /safety_control near special safety points,
# take it back after no override received for this time (s)
external_safety_hold_time: 0.5

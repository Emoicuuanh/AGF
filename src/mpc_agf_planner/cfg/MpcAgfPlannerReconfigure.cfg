#!/usr/bin/env python
PACKAGE = "mpc_agf_planner"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("allow_set_safety",  bool_t, 0, "Print current state or not", True)
gen.add("priority_angle_adjustment",  bool_t, 0, "Heading first when backing up close to the goal", False)

# MPC path tracking (live tuning). Defaults must match the param defaults in initialize().
gen.add("q_ey",        double_t, 0, "Weight on lateral error", 40.0, 0.0, 1000.0)
gen.add("q_epsi",      double_t, 0, "Weight on heading error", 6.0, 0.0, 1000.0)
gen.add("r_steer",     double_t, 0, "Weight on steering beyond what the path needs", 0.3, 0.0, 100.0)
gen.add("r_dsteer",    double_t, 0, "Weight on steering change per step", 1.0, 0.0, 100.0)
gen.add("qf_scale",    double_t, 0, "End-of-horizon weight multiplier", 10.0, 1.0, 100.0)
gen.add("a_lat_max",   double_t, 0, "Lateral acceleration limit in curves (m/s^2), applied on the next plan", 0.25, 0.05, 2.0)
gen.add("a_dec",       double_t, 0, "Planned braking (m/s^2), applied on the next plan", 0.3, 0.05, 2.0)
gen.add("v_creep_min", double_t, 0, "Minimum speed close to the goal (m/s), applied on the next plan", 0.1, 0.02, 0.5)
gen.add("creep_dist",  double_t, 0, "Distance driven at v_creep_min before the goal tolerance (m), applied on the next plan", 0.2, 0.0, 2.0)
gen.add("stop_lead_time", double_t, 0, "Send the stop this long before reaching the goal, to cover the coast-down (s)", 0.5, 0.0, 3.0)
# Reverse stopping (the robot coasts further backwards). -1 = same as forward.
gen.add("a_dec_reverse",          double_t, 0, "Planned braking when reversing (m/s^2), -1 = a_dec", -1.0, -1.0, 2.0)
gen.add("v_creep_min_reverse",    double_t, 0, "Creep speed when reversing (m/s), -1 = v_creep_min", -1.0, -1.0, 0.5)
gen.add("creep_dist_reverse",     double_t, 0, "Creep distance when reversing (m), -1 = creep_dist", -1.0, -1.0, 2.0)
gen.add("stop_lead_time_reverse", double_t, 0, "Stop lead time when reversing (s), -1 = stop_lead_time", -1.0, -1.0, 3.0)

size_enum = gen.enum([ gen.const("Small",      int_t, 0, "A small constant"),
                       gen.const("Medium",     int_t, 1, "A medium constant"),
                       gen.const("Large",      int_t, 2, "A large constant"),
                       gen.const("ExtraLarge", int_t, 3, "An extra large constant")],
                     "An enum to set size")

gen.add("size", int_t, 0, "A size parameter which is edited via an enum", 1, 0, 3, edit_method=size_enum)

exit(gen.generate(PACKAGE, "mpc_agf_planner", "MpcAgfPlannerReconfigure"))

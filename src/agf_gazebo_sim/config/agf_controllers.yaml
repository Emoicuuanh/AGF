agf_model:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  left_steering_position_controller:
    type: position_controllers/JointPositionController
    joint: left_steering_joint
    pid: {p: 500.0, i: 0.01, d: 10.0}

  right_steering_position_controller:
    type: position_controllers/JointPositionController
    joint: right_steering_joint
    pid: {p: 500.0, i: 0.01, d: 10.0}

  front_left_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: left_wheel_joint
    pid: {p: 100.0, i: 0.01, d: 0.1}

  front_right_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: right_wheel_joint
    pid: {p: 100.0, i: 0.01, d: 0.1}

  rear_left_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: left_back_wheel_joint
    pid: {p: 100.0, i: 0.01, d: 0.1}

  rear_right_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: right_back_wheel_joint
    pid: {p: 100.0, i: 0.01, d: 0.1}

  gazebo_ros_control:
    pid_gains:
      left_steering_joint: {p: 500.0, i: 0.01, d: 10.0}
      right_steering_joint: {p: 500.0, i: 0.01, d: 10.0}
      left_wheel_joint: {p: 100.0, i: 0.01, d: 0.1}
      right_wheel_joint: {p: 100.0, i: 0.01, d: 0.1}
      left_back_wheel_joint: {p: 100.0, i: 0.01, d: 0.1}
      right_back_wheel_joint: {p: 100.0, i: 0.01, d: 0.1}
